<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Decision UI</title>
    <style>
      :root {
        color-scheme: dark light;
        font-family: var(--oc-font, system-ui, -apple-system, sans-serif);
        color: var(--oc-fg, #e6e9ef);
        background: transparent;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
      }
      #root {
        padding: 0.75rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        max-width: 100%;
      }
      #root .oc-sdk-tabs {
        display: flex;
        width: 100%;
      }
      #root .oc-sdk-tab {
        flex: 1 1 0;
        justify-content: center;
      }
      #root .oc-sdk-trigger {
        width: 100%;
      }
      #root .oc-sdk-input[data-mono="true"] {
        font-family: var(--oc-mono, ui-monospace, monospace);
        font-size: 0.75rem;
        line-height: 1.42;
      }
      .du-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        flex-wrap: wrap;
      }
      .du-title-group {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        min-width: 0;
      }
      .du-title {
        font-size: 0.95rem;
        font-weight: 600;
        margin: 0;
        white-space: nowrap;
      }
      .du-actions {
        display: flex;
        align-items: center;
        gap: 0.375rem;
        flex-wrap: wrap;
      }
      .du-stack {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      .du-surface {
        background: var(--oc-elevated, rgba(128, 128, 128, 0.08));
        border: 1px solid var(--oc-border, rgba(128, 128, 128, 0.2));
        border-radius: var(--oc-radius, 8px);
        padding: 0.75rem;
        display: flex;
        flex-direction: column;
        gap: 0.625rem;
        min-width: 0;
      }
      .du-section-title-stack {
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
        min-width: 0;
      }
      .du-section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        flex-wrap: wrap;
      }
      .du-section-title {
        font-size: 0.82rem;
        font-weight: 600;
        line-height: 1.3;
      }
      .du-muted {
        font-size: 0.73rem;
        color: var(--oc-muted, #8f96a6);
        line-height: 1.4;
      }
      .du-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.5rem;
      }
      @media (min-width: 560px) {
        .du-grid {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }
      }
      .du-stat {
        background: var(--oc-muted-surface, rgba(128, 128, 128, 0.08));
        border-radius: calc(var(--oc-radius, 8px) - 2px);
        padding: 0.5rem 0.625rem;
        min-width: 0;
      }
      .du-stat-label {
        font-size: 0.71rem;
        color: var(--oc-muted, #8f96a6);
        margin-bottom: 0.15rem;
      }
      .du-stat-value {
        font-size: 0.85rem;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .du-chip-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.375rem;
      }
      .du-chip {
        appearance: none;
        border: 1px solid var(--oc-border);
        background: var(--oc-muted-surface);
        color: var(--oc-fg);
        border-radius: 999px;
        padding: 0.24rem 0.6rem;
        font-size: 0.72rem;
        font-family: inherit;
        cursor: pointer;
        transition: background 120ms ease, border-color 120ms ease;
      }
      .du-chip:hover {
        background: var(--oc-hover);
      }
      .du-chip[aria-pressed="true"] {
        background: var(--oc-selection);
        border-color: var(--oc-primary);
        color: var(--oc-primary-text);
        font-weight: 600;
      }
      .du-code {
        margin: 0;
        padding: 0.625rem;
        border-radius: calc(var(--oc-radius, 8px) - 2px);
        background: var(--oc-muted-surface);
        border: 1px solid var(--oc-border);
        font-family: var(--oc-mono, ui-monospace, monospace);
        font-size: 0.74rem;
        line-height: 1.45;
        overflow-x: auto;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .du-findings {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
      }
      .du-finding {
        padding: 0.45rem 0.6rem;
        border-radius: calc(var(--oc-radius, 8px) - 2px);
        background: var(--oc-muted-surface);
        border-left: 3px solid var(--oc-warning, #fbbf24);
        font-size: 0.74rem;
        line-height: 1.42;
      }
      .du-finding[data-severity="error"] {
        border-left-color: var(--oc-error, #f87171);
      }
      .du-finding[data-severity="clean"] {
        border-left-color: var(--oc-success, #34d399);
      }
      .du-shots {
        display: grid;
        grid-template-columns: 1fr;
        gap: 0.625rem;
      }
      @media (min-width: 560px) {
        .du-shots {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      .du-shot-card {
        background: var(--oc-muted-surface);
        border: 1px solid var(--oc-border);
        border-radius: calc(var(--oc-radius, 8px) - 2px);
        padding: 0.5rem;
        display: flex;
        flex-direction: column;
        gap: 0.375rem;
        min-width: 0;
      }
      .du-shot-card img {
        width: 100%;
        height: auto;
        border-radius: 4px;
        border: 1px solid var(--oc-border);
        display: block;
      }
      .du-log-list {
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
      }
      .du-log-item {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 0.5rem;
        padding: 0.45rem 0.55rem;
        border-radius: calc(var(--oc-radius, 8px) - 2px);
        background: var(--oc-muted-surface);
        font-size: 0.74rem;
      }
      .du-log-summary {
        min-width: 0;
        flex: 1 1 auto;
        word-break: break-word;
      }
      .du-log-meta {
        flex-shrink: 0;
        font-variant-numeric: tabular-nums;
        color: var(--oc-muted);
        font-size: 0.7rem;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="./main.js"></script>
  </body>
</html>
